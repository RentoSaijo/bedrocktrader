url: https://rentosaijo.github.io/bedrocktrader/

template:
  bootstrap: 5
  bootswatch: cosmo
  light-switch: true

navbar:
  title: "bedrocktrader"
  structure:
    left: [intro, reference]
    right: [search, github, lightswitch]
  components:
    intro:
      icon: fa-home fa-lg
      href: index.html
      aria-label: Home
    reference:
      text: "Functions"
      href: reference/index.html
    github:
      icon: fa-github
      href: https://github.com/RentoSaijo/bedrocktrader
      aria-label: GitHub

authors:
  Rento Saijo:
    href: https://github.com/RentoSaijo

reference:
  - title: "Package"
    desc: >
      Package overview
    contents:
      - bedrocktrader

  - title: "Meta"
    desc: >
      Inspect professions, variants, and tiers
    contents:
      - villager_professions
      - villager_variants
      - villager_tiers

  - title: "Data"
    desc: >
      Inspect possible trade outcomes
    contents:
      - villager_trades
